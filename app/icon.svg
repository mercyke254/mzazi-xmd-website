    <linearGradient id="xmd-icon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="52%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#xmd-icon-bg)" />
  <path d="M36 8 L19 33 H29 L26 56 L45 27 H34 Z" fill="#ffffff" />
</svg>
